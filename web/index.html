<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Egzaminy zawodowe">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Egzaminy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Egzaminy</title>

  <style>
    body {
      margin: 0;
      background: #121212;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }

    #loader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      z-index: 9999;
    }

    #logo {
      width: 100px;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
    }

    .text-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .text-row:last-child {
      margin-bottom: 0;
    }

    .text-row span {
      display: inline-block;
      font-size: 32px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(10px);
      animation: letterFade 0.6s forwards;
    }

    /* Delay for each letter */
    .egzaminy span:nth-child(1) { animation-delay: 0.05s; }
    .egzaminy span:nth-child(2) { animation-delay: 0.1s; }
    .egzaminy span:nth-child(3) { animation-delay: 0.15s; }
    .egzaminy span:nth-child(4) { animation-delay: 0.2s; }
    .egzaminy span:nth-child(5) { animation-delay: 0.25s; }
    .egzaminy span:nth-child(6) { animation-delay: 0.3s; }
    .egzaminy span:nth-child(7) { animation-delay: 0.35s; }
    .egzaminy span:nth-child(8) { animation-delay: 0.4s; }

    .zawodowe span:nth-child(1) { animation-delay: 0.45s; }
    .zawodowe span:nth-child(2) { animation-delay: 0.5s; }
    .zawodowe span:nth-child(3) { animation-delay: 0.55s; }
    .zawodowe span:nth-child(4) { animation-delay: 0.6s; }
    .zawodowe span:nth-child(5) { animation-delay: 0.65s; }
    .zawodowe span:nth-child(6) { animation-delay: 0.7s; }
    .zawodowe span:nth-child(7) { animation-delay: 0.75s; }
    .zawodowe span:nth-child(8) { animation-delay: 0.8s; }
    .zawodowe span:nth-child(9) { animation-delay: 0.85s; }


    @keyframes letterFade {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes pulse {
      0%   { opacity: 1; }
      50%  { opacity: 0.4; }
      100% { opacity: 1; }
    }
    .pulsing {
  animation: pulse 1.5s ease-in-out infinite;
}

  </style>
</head>

<body>
  <div id="loader">
    <!-- Logo -->
    <img id="logo" src="logo.png" alt="Logo">

    <!-- EGZAMINY -->
    <div class="text-row egzaminy">
      <span>E</span><span>G</span><span>Z</span><span>A</span><span>M</span><span>I</span><span>N</span><span>Y</span>
    </div>

    <!-- ZAWODOWE -->
    <div class="text-row zawodowe">
      <span>Z</span><span>A</span><span>W</span><span>O</span><span>D</span><span>O</span><span>W</span><span>E</span>
    </div>
  </div>

<script>
  window.addEventListener('load', () => {
    const loader = document.getElementById('loader');
    const rows = document.querySelectorAll('.text-row');

    if (loader) {
      // 1. Włącz miganie tekstu po 1.8s
      setTimeout(() => {
        rows.forEach(row => row.classList.add('pulsing'));
      }, 1000);

      // 2. Ukryj loader po 3.5s (czyli miganie też trochę potrwa)
      setTimeout(() => {
        loader.style.animation = 'fadeOut 0.5s forwards';
      }, 2800);
    }
  });
</script>


  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
