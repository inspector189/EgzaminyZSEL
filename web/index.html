<!DOCTYPE html>
<html lang="pl">

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="Egzaminy zawodowe">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Egzaminy">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="manifest" href="manifest.json">
  <title>Egzaminy</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #121212;
      color: white;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #logo {
      width: 100px;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
    }

    .text-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .text-row:last-child {
      margin-bottom: 0;
    }

    .text-row span {
      display: inline-block;
      font-size: 32px;
      font-weight: bold;
      opacity: 0.4;
      animation: fadeWave 1.2s ease-in-out infinite;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes fadeWave {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div id="loader">
    <img id="logo" src="logo.png" alt="Logo">
    <div class="text-row" data-text="EGZAMINY"></div>
    <div class="text-row" data-text="ZAWODOWE"></div>
  </div>

  <script>
    const letterDelay = 0.16;

    document.querySelectorAll('.text-row').forEach(row => {
      const text = row.dataset.text;
      row.innerHTML = '';
      for (let char of text) {
        const span = document.createElement('span');
        span.textContent = char;
        row.appendChild(span);
      }
    });

    document.querySelectorAll('.text-row').forEach(row => {
      const spans = row.querySelectorAll('span');
      spans.forEach((span, i) => {
        span.style.animationDelay = `${i * letterDelay}s`;
      });
    });

    window.addEventListener('flutter-first-frame', () => {
      const loader = document.getElementById('loader');
      loader.style.opacity = '0';
      setTimeout(() => loader.remove(), 500);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const logo = document.getElementById('logo');
      logo.style.animation = 'fadeIn 1s ease-out forwards';
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
