<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logowanie...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121212;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px 48px;
      background: #1e1e1e;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: rgba(33, 150, 243, 255);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    p {
      color: #ccc;
      font-size: 18px;
      letter-spacing: 0.3px;
    }
  </style>

<body>
  <div class="card">
    <div class="spinner"></div>
    <p>Trwa logowanie...</p>
  </div>
  <script>

    const url = new URL(window.location.href);
    const code = url.searchParams.get('code');
    const state = url.searchParams.get('state');

    const baseUrl = `https://egzaminy.zsel.edu.pl/`;

    if (code && state) {
      window.location.href = baseUrl + `?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;
    } else {
      console.error('BŁĄD: Brak code lub state!', url.href);
      window.location.href = baseUrl + '?error=no_code&debug=' + encodeURIComponent(url.href);
    }
  </script>
</body>

</html>
