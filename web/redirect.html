<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Logowanie...</title>
</head>
<body>
  <h3>Trwa logowanie...</h3>
  <script>
    const url = new URL(window.location.href);
    const code = url.searchParams.get('code');
    const state = url.searchParams.get('state');

    if (code && state) {
      window.location.href = `https://egzaminy.zsel.edu.pl/?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;
    } else {
      console.error('BŁĄD: Brak code lub state!', url.href);
      window.location.href = 'https://egzaminy.zsel.edu.pl/?error=no_code&debug=' + encodeURIComponent(url.href);
    }
  </script>
</body>
</html>
